name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore EduVibe.slnx
      - run: dotnet build EduVibe.slnx --no-restore -c Release
      - run: dotnet test EduVibe.slnx --no-build -c Release
      - name: Docker image builds
        run: docker build -f src/Api/EduVibe.Api/Dockerfile -t eduvibe-api:ci .

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  demo-stack:
    name: Demo stack (docker compose)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile full up -d --build
      - name: Wait for the API and sign in as the seeded Super Admin
        run: |
          for i in $(seq 1 40); do
            curl -fs http://localhost:5077/health/ready && break
            sleep 3
          done
          curl -fs http://localhost:5077/health/ready
          curl -fs -X POST http://localhost:5077/api/identity/login \
            -H 'content-type: application/json' \
            -d '{"phone":"0770000000","password":"ChangeMe123"}' | grep -q accessToken
      - name: The web app serves the app and its routes
        run: |
          curl -fs http://localhost:4200/config.json | grep -q apiBaseUrl
          curl -fs http://localhost:4200/login | grep -q "<app-root"
      - if: failure()
        run: docker compose --profile full logs
      - if: always()
        run: docker compose --profile full down -v

name: Deploy web (free test)

# Publishes the Angular app to Azure Static Web Apps (free plan) when web/ changes on main.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN and the repository variable API_BASE_URL
# (see docs/deploy-free.md). Until both exist the job is skipped, so CI is never blocked.
on:
  push:
    branches: [main]
    paths: [web/**, .github/workflows/deploy-web.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Static Web Apps
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Check settings
        id: ready
        run: |
          if [ -n "$API_BASE_URL" ] && [ -n "$SWA_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Deployment not set up yet; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: steps.ready.outputs.go == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          # One build runs anywhere: the API address is written next to it, not compiled in.
          jq -n --arg url "${API_BASE_URL%/}" '{apiBaseUrl: $url}' > dist/eduvibe-web/browser/config.json
      - uses: Azure/static-web-apps-deploy@v1
        if: steps.ready.outputs.go == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          skip_api_build: true
          app_location: web/dist/eduvibe-web/browser
          output_location: ""

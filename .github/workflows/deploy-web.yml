name: Deploy web (free test)

# Publishes the Angular app after CI has passed on main, to every host that is set up:
# - Cloudflare Workers (static assets): secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, config in web/wrangler.jsonc.
# - Azure Static Web Apps (free plan): secret AZURE_STATIC_WEB_APPS_API_TOKEN. Kept until the Cloudflare site is verified.
# Both need the repository variable API_BASE_URL (see docs/deploy-free.md). A host whose settings are missing is skipped,
# so CI is never blocked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Only after CI went green on main (or when started by hand).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    outputs:
      go: ${{ steps.ready.outputs.go }}
    steps:
      - name: Check settings
        id: ready
        run: |
          if [ -n "$API_BASE_URL" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "API_BASE_URL not set yet; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          # The commit CI just tested (empty for a manual run, which uses the branch it was started on).
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: steps.ready.outputs.go == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          # One build runs anywhere: the API address is written next to it, not compiled in.
          jq -n --arg url "${API_BASE_URL%/}" '{apiBaseUrl: $url}' > dist/gurubook-web/browser/config.json
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: web
          path: web/dist/gurubook-web/browser
          retention-days: 1

  cloudflare:
    name: Cloudflare
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check settings
        id: ready
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Cloudflare not set up yet; skipping."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: web/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: web
          path: web/dist/gurubook-web/browser
      - uses: cloudflare/wrangler-action@v3
        if: steps.ready.outputs.go == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          workingDirectory: web
          command: deploy

  azure:
    name: Static Web Apps
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Check settings
        id: ready
        run: |
          if [ -n "$SWA_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Azure not set up; skipping."; fi
      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.go == 'true'
        with:
          name: web
          path: web-dist
      - uses: Azure/static-web-apps-deploy@v1
        if: steps.ready.outputs.go == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          skip_api_build: true
          app_location: web-dist
          output_location: ""

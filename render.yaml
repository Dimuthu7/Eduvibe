# Free test deployment of the API on Render. See docs/deploy-free.md.
# Render builds the same Docker image as everywhere else, so moving to Azure later needs no code change.
services:
  - type: web
    name: eduvibe-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/Api/GuruBook.Api/Dockerfile
    dockerContext: .
    branch: main
    # Deploy on every push to main. CI is already required before anything reaches main (branch protection),
    # so waiting for checks here added nothing and did not trigger in practice.
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ForwardedHeaders__Enabled
        value: "true"
      # Generated once by Render and kept between deploys.
      - key: Jwt__SigningKey
        generateValue: true
      # Filled in on the Render dashboard (sync: false keeps secrets out of git).
      - key: ConnectionStrings__EduVibe
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: SuperAdmin__Phone
        sync: false
      - key: SuperAdmin__Password
        sync: false
      # Google Drive for class materials (see docs/drive-setup.md). Optional: without them the Materials screen says Drive is not set up.
      - key: Google__ClientId
        sync: false
      - key: Google__ClientSecret
        sync: false
      - key: Google__RedirectUri
        sync: false
      # WhatsApp messages (see docs/whatsapp-setup.md). Simulated pretends to send so the screens can be tried; change to Meta only once the Meta account and templates are ready (Off turns it off).
      - key: WhatsApp__Mode
        value: Simulated
      - key: WhatsApp__PhoneNumberId
        sync: false
      - key: WhatsApp__AccessToken
        sync: false
      - key: WhatsApp__VerifyToken
        sync: false
      - key: WhatsApp__AppSecret
        sync: false

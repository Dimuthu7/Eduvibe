server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Settings and the service worker files must never be served stale.
  location ~ ^/(config\.json|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # Angular routes: unknown paths fall back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

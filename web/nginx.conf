server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers on every response (the same as public/_headers). add_header in a location replaces these, so the
  # location below repeats them through the include.
  include /etc/nginx/conf.d/security-headers.inc;

  # Settings and the service worker files must never be served stale.
  location ~ ^/(config\.json|ngsw\.json|ngsw-worker\.js|safety-worker\.js|gurubook-sw\.js|push-text\.js)$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
  }

  # Angular routes: unknown paths fall back to the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

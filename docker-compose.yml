# Local development database. Run: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eduvibe
      POSTGRES_PASSWORD: eduvibe
      POSTGRES_DB: eduvibe
    ports:
      - "5432:5432"
    volumes:
      - eduvibe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvibe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eduvibe-pgdata:
